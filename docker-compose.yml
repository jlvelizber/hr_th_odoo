services:
  odoo:
    image: odoo:17.0
    container_name: hr_th_odoo17
    depends_on:
      - db
    ports:
      - "${ODOO_HTTP_PORT:-8072}:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./docker/entrypoint-bootstrap.sh:/entrypoint-bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-bootstrap.sh"]
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      ODOO_DB: ${POSTGRES_DB:-hr_th_dev}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-hr_service_management,recruitment_service,hr_ec_payroll,l10n_ec_th_edi}
      ODOO_AUTO_BOOTSTRAP: ${ODOO_AUTO_BOOTSTRAP:-1}
      ODOO_WITH_DEMO: ${ODOO_WITH_DEMO:-1}
      ODOO_UPDATE_ON_START: ${ODOO_UPDATE_ON_START:-0}
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: hr_th_postgres16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
